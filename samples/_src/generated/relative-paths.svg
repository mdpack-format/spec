  <polygon points="448,162 454,174 468,176 458,186 460,200 448,192 436,200 438,186 428,176 442,174" fill="#F0B429"/>
  <text x="478" y="184" font-family="Consolas, Menlo, monospace" font-size="14" fill="#102A43">star.png</text>
